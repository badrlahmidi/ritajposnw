<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITAJ POS — Afficheur Client</title>
  <style>
    /* ── Variables ────────────────────────────────────────────── */
    :root {
      --color-bg:        #0a0e1a;
      --color-surface:   #111827;
      --color-primary:   #f59e0b;
      --color-accent:    #10b981;
      --color-text:      #f9fafb;
      --color-muted:     #6b7280;
      --color-border:    #1f2937;
      --color-danger:    #ef4444;
      --font-base:       'Segoe UI', Arial, sans-serif;
      --radius-lg:       16px;
      --shadow:          0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-base);
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: var(--color-surface);
      border-bottom: 2px solid var(--color-primary);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon { font-size: 36px; }
    .logo-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--color-primary);
    }

    .clock {
      font-size: 28px;
      font-weight: 600;
      color: var(--color-text);
      font-variant-numeric: tabular-nums;
    }

    /* ── Contenu principal ───────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Écran idle (accueil) ────────────────────────────────── */
    #idle-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
    }

    .idle-icon { font-size: 96px; animation: pulse 3s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.08); opacity: 0.8; }
    }

    .idle-title {
      font-size: 42px;
      font-weight: 700;
      color: var(--color-primary);
      text-align: center;
    }

    .idle-subtitle {
      font-size: 22px;
      color: var(--color-muted);
      text-align: center;
    }

    /* ── Écran ticket ────────────────────────────────────────── */
    #ticket-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ticket-header {
      padding: 20px 32px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticket-header h2 {
      font-size: 24px;
      color: var(--color-text);
    }

    .table-badge {
      background: var(--color-primary);
      color: #000;
      font-weight: 700;
      font-size: 20px;
      padding: 6px 18px;
      border-radius: 24px;
    }

    .ticket-lines {
      flex: 1;
      overflow-y: auto;
      padding: 16px 32px;
      scrollbar-width: none;
    }
    .ticket-lines::-webkit-scrollbar { display: none; }

    .ticket-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-border);
      font-size: 20px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .line-qty {
      background: var(--color-primary);
      color: #000;
      font-weight: 700;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .line-name {
      flex: 1;
      margin-left: 16px;
      color: var(--color-text);
    }

    .line-price {
      font-weight: 600;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }

    /* ── Total ───────────────────────────────────────────────── */
    .total-bar {
      padding: 24px 32px;
      background: var(--color-surface);
      border-top: 2px solid var(--color-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-size: 28px;
      color: var(--color-muted);
      font-weight: 600;
    }

    .total-amount {
      font-size: 48px;
      font-weight: 800;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }

    /* ── Écran paiement ──────────────────────────────────────── */
    #payment-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a2a1a 100%);
    }

    .payment-icon { font-size: 80px; animation: bounce 1s ease-in-out infinite alternate; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-12px); }
    }

    .payment-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--color-accent);
    }

    .payment-amount {
      font-size: 64px;
      font-weight: 800;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }

    .payment-subtitle { font-size: 22px; color: var(--color-muted); }

    /* ── Écran message ───────────────────────────────────────── */
    #message-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .message-text {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--color-text);
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Screens visibilité ──────────────────────────────────── */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }

    /* ── Statut connexion ────────────────────────────────────── */
    .ws-dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; margin-right: 6px;
      background: var(--color-muted);
    }
    .ws-dot.connected { background: var(--color-accent); }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      padding: 8px 32px;
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-muted);
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">☕</span>
    <span class="logo-name" id="commerce-name">RITAJ SMART POS</span>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <!-- IDLE -->
  <div id="idle-screen" class="screen active">
    <span class="idle-icon">👋</span>
    <div class="idle-title" id="idle-welcome">Bienvenue !</div>
    <div class="idle-subtitle">Votre commande est en cours de préparation</div>
  </div>

  <!-- TICKET -->
  <div id="ticket-screen" class="screen">
    <div class="ticket-header">
      <h2 id="cmd-numero">Commande</h2>
      <span class="table-badge" id="cmd-table" style="display:none"></span>
    </div>
    <div class="ticket-lines" id="ticket-lines"></div>
    <div class="total-bar">
      <span class="total-label">TOTAL</span>
      <span class="total-amount" id="ticket-total">0,00 DH</span>
    </div>
  </div>

  <!-- PAIEMENT -->
  <div id="payment-screen" class="screen">
    <span class="payment-icon">💳</span>
    <div class="payment-title">Montant à régler</div>
    <div class="payment-amount" id="payment-amount">0,00 DH</div>
    <div class="payment-subtitle">Merci de présenter votre moyen de paiement</div>
  </div>

  <!-- MESSAGE CUSTOM -->
  <div id="message-screen" class="screen">
    <div class="message-text" id="custom-message"></div>
  </div>
</main>

<footer>
  <div>
    <span class="ws-dot" id="ws-dot"></span>
    <span id="ws-status">Connexion…</span>
  </div>
  <div id="footer-date"></div>
</footer>

<script>
(function () {
  'use strict';

  // ── Configuration ────────────────────────────────────────────
  const BASE = window.location.pathname.replace(/\/customer-display.*$/, '') || '';
  const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${BASE}/ws`;
  const API_POLL_MS = 3000; // Fallback polling si WS indisponible

  // ── Horloge ──────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('fr-MA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('footer-date').textContent = now.toLocaleDateString('fr-MA', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Rendu ────────────────────────────────────────────────────
  function formatMontant(v) {
    return Number(v || 0).toLocaleString('fr-MA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' DH';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  function renderState(state) {
    if (!state) return;

    switch (state.mode) {
      case 'idle':
      default:
        showScreen('idle-screen');
        break;

      case 'ticket': {
        showScreen('ticket-screen');
        const cmd = state.commande || {};
        document.getElementById('cmd-numero').textContent = cmd.numero ? `Cmd #${cmd.numero}` : 'Votre commande';
        const tableEl = document.getElementById('cmd-table');
        if (cmd.table_numero) {
          tableEl.textContent = `Table ${cmd.table_numero}`;
          tableEl.style.display = '';
        } else {
          tableEl.style.display = 'none';
        }

        const container = document.getElementById('ticket-lines');
        container.innerHTML = '';
        (cmd.lignes || []).forEach(l => {
          const div = document.createElement('div');
          div.className = 'ticket-line';
          div.innerHTML = `
            <span class="line-qty">${l.quantite}</span>
            <span class="line-name">${escapeHtml(l.produit_nom || l.nom || '?')}</span>
            <span class="line-price">${formatMontant(l.total_ligne)}</span>
          `;
          container.appendChild(div);
        });
        document.getElementById('ticket-total').textContent = formatMontant(state.total);
        break;
      }

      case 'payment':
        showScreen('payment-screen');
        document.getElementById('payment-amount').textContent = formatMontant(state.total);
        break;

      case 'message':
        showScreen('message-screen');
        document.getElementById('custom-message').textContent = state.message || '';
        break;
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Charger la config commerce ────────────────────────────────
  fetch(`${BASE}/api/parametres/public`)
    .then(r => r.json())
    .then(d => {
      const nom = d?.data?.nom_commerce;
      if (nom) {
        document.getElementById('commerce-name').textContent = nom;
        document.title = `${nom} — Afficheur Client`;
        document.getElementById('idle-welcome').textContent = `Bienvenue chez ${nom} !`;
      }
    })
    .catch(() => { /* silent */ });

  // ── WebSocket ────────────────────────────────────────────────
  let ws = null;
  let wsConnected = false;
  let pollTimer = null;

  function setWsStatus(connected) {
    wsConnected = connected;
    const dot = document.getElementById('ws-dot');
    const label = document.getElementById('ws-status');
    dot.className = 'ws-dot' + (connected ? ' connected' : '');
    label.textContent = connected ? 'Connecté' : 'Reconnexion…';
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
      fetch(`${BASE}/api/afficheur/etat`)
        .then(r => r.json())
        .then(d => renderState(d?.data))
        .catch(() => { });
    }, API_POLL_MS);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function connectWS() {
    try {
      ws = new WebSocket(WS_URL);
    } catch {
      setWsStatus(false);
      startPolling();
      return;
    }

    ws.onopen = () => {
      setWsStatus(true);
      stopPolling();
    };

    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.event === 'display.updated') {
          renderState(msg.payload);
        }
      } catch { /* ignore */ }
    };

    ws.onclose = () => {
      setWsStatus(false);
      ws = null;
      startPolling();
      setTimeout(connectWS, 3000);
    };

    ws.onerror = () => {
      setWsStatus(false);
      startPolling();
    };
  }

  // Charger l'état initial depuis l'API, puis connecter WS
  fetch(`${BASE}/api/afficheur/etat`)
    .then(r => r.json())
    .then(d => renderState(d?.data))
    .catch(() => { })
    .finally(() => connectWS());

})();
</script>
</body>
</html>
